<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません｜DARWIN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 404ページ。存在しないURLを開いたときに出る。
   ここが素っ気ないと「潰れたサイト」に見えるので、本体と同じ顔にしておく。
   本体のCSSは読み込まず、このページだけで完結させる（1ファイルで動く＝壊れない）。 */
:root{ --ink:#0b0b0c; --paper:#f5f3ef; --amber:#d9a03c; --soft:#b4b1ab; }
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
  background:var(--ink); color:var(--paper); text-align:center; padding:32px;
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
  font-feature-settings:"palt" 1; line-height:1.9;
}
.mark{ width:76px; height:76px; margin:0 auto 30px; display:block; }
h1{ font-size:clamp(22px,4.4vw,32px); font-weight:900; margin:0 0 14px; letter-spacing:.01em; }
p{ color:var(--soft); font-size:14.5px; margin:0 0 34px; }
p span{ display:inline-block; }   /* 語の途中で改行させない */
a{
  display:inline-block; color:var(--ink); background:var(--paper);
  text-decoration:none; font-weight:700; font-size:14px;
  padding:14px 30px; border-bottom:2px solid var(--amber);
}
a:hover{ background:#e9e7e2; }
a:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" fill="#0b0b0c"/>
      <path fill="#f5f3ef" fill-rule="evenodd"
            d="M81.9 56.3h85.9a199.7 199.7 0 0 1 0 399.4H81.9z
               M167.8 142.2a113.8 113.8 0 0 1 0 227.6z"/>
      <rect y="484" width="512" height="28" fill="#a8761a"/>
    </svg>
    <h1>ページが見つかりません</h1>
    <p><span>お探しのページは、移動したか</span><span>削除された可能性があります。</span></p>
    <a href="./">トップページへ</a>
  </main>
</body>
</html>
